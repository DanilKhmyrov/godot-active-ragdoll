[plugin]

name="Active Ragdoll"
description="Powered (active) ragdoll for humanoid Skeleton3D: builds physical bones from a profile and drives them with PD muscles toward the animated pose. Behaviours: collapse (legs give out first), fall with bracing arms / tucked chin, hit reactions that recover by muscle force. Works with Jolt and Godot Physics."
author="Danil Khmyrov"
version="0.1.0"
script="plugin.gd"
